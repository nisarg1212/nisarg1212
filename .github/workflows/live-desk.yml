name: Update Live Desk

on:
  schedule:
    - cron: "0 * * * *" # Runs every hour
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate Desk SVG
        run: python live_desk.py

      - name: Generate Sci-Fi ID Badge
        run: python id_badge.py

      - name: Commit and Push Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live_desk.svg id_badge_light.svg id_badge_dark.svg
          git commit -m "Update profile SVGs (Desk & Badge)" || exit 0
          git push
