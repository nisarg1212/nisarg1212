<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
        <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#cbd5e1" stroke-width="0.5" stroke-opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="250" fill="#030712" rx="10" />
  <rect width="800" height="250" fill="url(#grid)" rx="10" />
  
  <!-- Frame Brackets (Sci-Fi Targeting UI) -->
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00ffcc" stroke-width="2" filter="url(#glow)"/>
  <path d="M 775 55 L 775 25 L 745 25" fill="none" stroke="#00ffcc" stroke-width="2" filter="url(#glow)"/>
  <path d="M 25 195 L 25 225 L 55 225" fill="none" stroke="#00ffcc" stroke-width="2" filter="url(#glow)"/>
  <path d="M 775 195 L 775 225 L 745 225" fill="none" stroke="#00ffcc" stroke-width="2" filter="url(#glow)"/>

  <!-- Decorative Hex / Coordinates -->
  <text x="35" y="218" font-family="'Courier New', monospace" font-size="10" fill="#475569">SYS.INIT. 2026-06-05T19:45:41Z</text>
  <text x="640" y="218" font-family="'Courier New', monospace" font-size="10" fill="#475569">SEC-CLR: Lvl 1470 // V.1.0</text>

  <!-- Main Data Display -->
  <text x="60" y="80" font-family="'Courier New', monospace" font-size="14" fill="#00ffcc" font-weight="bold" letter-spacing="2" filter="url(#glow)">>_ UPLINK ESTABLISHED</text>
  
  <text x="60" y="125" font-family="'Courier New', monospace" font-size="42" fill="#f8fafc" font-weight="bold" letter-spacing="4">NISARG BHATT</text>
  <text x="65" y="155" font-family="'Courier New', monospace" font-size="16" fill="#94a3b8" letter-spacing="3">PROBLEM SOLVER | PROGRAMMER</text>

  <!-- Connecting Lines -->
  <line x1="65" y1="180" x2="350" y2="180" stroke="#00ffcc" stroke-width="1" opacity="0.4" />
  <circle cx="355" cy="180" r="3" fill="#00ffcc" filter="url(#glow)" />

  <!-- Minimal Barcode Right -->
  <rect x="640" y="160" width="1" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="643" y="160" width="3" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="648" y="160" width="2" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="652" y="160" width="1" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="657" y="160" width="1" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="662" y="160" width="4" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="668" y="160" width="1" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="671" y="160" width="2" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="675" y="160" width="1" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="680" y="160" width="2" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="686" y="160" width="4" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="692" y="160" width="4" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="700" y="160" width="3" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="705" y="160" width="2" height="40" fill="#00ffcc" opacity="0.8"/>
<rect x="711" y="160" width="4" height="40" fill="#00ffcc" opacity="0.8"/>

  
  <!-- Side Data / Terminal readout -->
  <text x="640" y="70" font-family="'Courier New', monospace" font-size="12" fill="#64748b">AUTH: VERIFIED</text>
  <text x="640" y="90" font-family="'Courier New', monospace" font-size="12" fill="#64748b">NODE: NISARG1212</text>
  <rect x="640" y="105" width="80" height="2" fill="#00ffcc" filter="url(#glow)" opacity="0.8" />
  <rect x="725" y="105" width="10" height="2" fill="#00ffcc" filter="url(#glow)" opacity="0.8" />
</svg>
